name: Discover Android TV Emulator Images

on:
  push:
    branches:
      - asiaflix-clean-shell
    paths:
      - '.github/workflows/list-tv-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: android-actions/setup-android@v3
      - name: List available TV system images
        run: |
          sdkmanager --list | grep -E 'system-images;android-[0-9]+;(android-tv|google-tv);' | tail -n 120
