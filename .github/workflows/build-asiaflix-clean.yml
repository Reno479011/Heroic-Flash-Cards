name: Build and Verify Asia Flix 2.1

on:
  push:
    branches:
      - asiaflix-clean-shell
    paths:
      - 'asiaflix-clean-shell/**'
      - '.github/workflows/build-asiaflix-clean.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'asiaflix-clean-shell/**'
      - '.github/workflows/build-asiaflix-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Install canonical v2.1 source tree
        run: python3 asiaflix-clean-shell/tools/install_canonical_v2.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and signing tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify canonical feature matrix and JavaScript syntax
        working-directory: asiaflix-clean-shell
        run: |
          node --check app/src/main/assets/asiaflix_bridge.js
          python3 tools/verify_canonical_release.py

      - name: Run JVM regression tests
        working-directory: asiaflix-clean-shell
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug, instrumentation, and signed release APKs
        working-directory: asiaflix-clean-shell
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon --stacktrace

      - name: Verify package, permissions, TV launcher, SDK absence, and signature
        run: |
          set -euo pipefail
          RELEASE='asiaflix-clean-shell/app/build/outputs/apk/release/app-release.apk'
          DEBUG='asiaflix-clean-shell/app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RELEASE" | tee release-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE" | tee release-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$RELEASE" | tee release-permissions.txt
          unzip -l "$RELEASE" | tee release-archive.txt
          grep -q "package: name='org.asiaflix.clean' versionCode='21' versionName='2.1.0'" release-badging.txt
          grep -q '^leanback-launchable-activity:' release-badging.txt
          ! grep -E 'POST_NOTIFICATIONS|SYSTEM_ALERT_WINDOW|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE' release-permissions.txt
          ! grep -Ei 'appsgeyser|appodeal|applovin|admob|ironsource|pangle' release-archive.txt
          mkdir -p out
          cp "$RELEASE" out/Asia_Flix_Final_Onn4K_Mobile_v2.1.apk
          cp "$DEBUG" out/Asia_Flix_Final_Onn4K_Mobile_v2.1-debug.apk
          sha256sum out/*.apk | tee out/SHA256.txt

      - name: Upload build for emulator jobs
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-v2.1-build
          path: |
            asiaflix-clean-shell/app/build/outputs/apk/debug/app-debug.apk
            asiaflix-clean-shell/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            asiaflix-clean-shell/app/build/reports/tests/testDebugUnitTest/
            out/
            release-signature.txt
            release-badging.txt
            release-permissions.txt
            release-archive.txt
          if-no-files-found: error
          retention-days: 30

  mobile-functional-test:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install canonical v2.1 source tree
        run: python3 asiaflix-clean-shell/tools/install_canonical_v2.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Pixel 6 / Android 15 functional and live-player suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash asiaflix-clean-shell/tools/run_mobile_emulator_suite.sh

      - name: Upload mobile test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-v2.1-mobile-functional-evidence
          path: |
            asiaflix-clean-shell/app/build/reports/androidTests/connected/
            asiaflix-clean-shell/app/build/outputs/androidTest-results/connected/
            mobile-evidence/
          if-no-files-found: warn
          retention-days: 30

  android-tv-functional-test:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install canonical v2.1 source tree
        run: python3 asiaflix-clean-shell/tools/install_canonical_v2.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android TV 1080p Onn-style D-pad, focus, ad, and seek suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash asiaflix-clean-shell/tools/run_tv_emulator_suite.sh

      - name: Upload Android TV test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-v2.1-TV-functional-evidence
          path: |
            asiaflix-clean-shell/app/build/reports/androidTests/connected/
            asiaflix-clean-shell/app/build/outputs/androidTest-results/connected/
            tv-evidence/
          if-no-files-found: warn
          retention-days: 30

  release-gate:
    needs: [build-and-unit-test, mobile-functional-test, android-tv-functional-test]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK build
        uses: actions/download-artifact@v4
        with:
          name: Asia-Flix-v2.1-build
          path: verified/build

      - name: Download mobile functional evidence
        uses: actions/download-artifact@v4
        with:
          name: Asia-Flix-v2.1-mobile-functional-evidence
          path: verified/mobile

      - name: Download Android TV functional evidence
        uses: actions/download-artifact@v4
        with:
          name: Asia-Flix-v2.1-TV-functional-evidence
          path: verified/tv

      - name: Assemble final gated release and report
        run: |
          set -euo pipefail
          mkdir -p final/evidence/mobile final/evidence/tv
          cp verified/build/out/Asia_Flix_Final_Onn4K_Mobile_v2.1.apk final/
          cp verified/build/out/SHA256.txt final/
          cp verified/build/release-signature.txt final/
          cp verified/build/release-badging.txt final/
          cp verified/build/release-permissions.txt final/
          cp verified/build/release-archive.txt final/
          cp -R verified/mobile/. final/evidence/mobile/
          cp -R verified/tv/. final/evidence/tv/
          cat > final/Asia_Flix_Final_v2.1_Verification.txt <<'REPORT'
          Asia Flix Final v2.1 release gate passed.

          Verified from one canonical source tree:
          - First-party /api/advertisements and /api/advertisements/ responses blocked before the XM banner can render.
          - Surgical XM fallback removal and advertisement-slot collapse without deleting movie/player containers.
          - Persistent large blue focus outline for shows, movies, episodes, menus, buttons, and player choices.
          - Android TV geometric D-pad navigation and Leanback launcher behavior.
          - Onn-style Center/OK, play/pause, rewind, fast-forward, D-pad hold, and media-key routing.
          - Double-tap left/right performs one 10-second seek.
          - Hold seeking accelerates through 10 seconds, 30 seconds, 1 minute, and 2 minutes.
          - Native player timeline/control region is passed through without gesture interception.
          - Mobile native custom-view fullscreen, sensor landscape, Back exit, orientation restore, and selector restore.
          - Popup, custom-intent, Google Play, outside-browser, notification, overlay, accessibility, and install-package paths absent or blocked.
          - No AppsGeyser or advertising SDK package found in the release archive.
          - JVM regression tests passed.
          - Pixel 6 Android 15 emulator functional and live-player tests passed with screenshots and logcat evidence.
          - Android TV 1080p API 34 emulator focus, ad-removal, seek, D-pad, and Leanback tests passed with screenshots and logcat evidence.
          - APK package, version, permissions, Android TV launcher, archive, and signature scans passed.

          Physical-device limitation:
          The environment cannot physically operate a Walmart Onn 4K Streaming Box or Galaxy S23+. The release was tested on hardware-accelerated Android phone and Android TV emulators. Final acceptance on those two physical devices remains necessary.
          REPORT

      - name: Upload final gated release
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-Final-v2.1-Verified
          path: final/
          if-no-files-found: error
          retention-days: 30
