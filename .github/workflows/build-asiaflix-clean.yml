name: Build Asia Flix Clean APK

on:
  push:
    branches:
      - asiaflix-clean-shell
    paths:
      - 'asiaflix-clean-shell/**'
      - '.github/workflows/build-asiaflix-clean.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'asiaflix-clean-shell/**'
      - '.github/workflows/build-asiaflix-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply v1.3 media controls
        working-directory: asiaflix-clean-shell
        run: python3 tools/apply_v1_3_patch.py

      - name: Restore v1.1-style TV navigator
        working-directory: asiaflix-clean-shell
        run: python3 tools/apply_v1_4_navigator_patch.py

      - name: Add v1.5 timeline and accelerated seeking
        working-directory: asiaflix-clean-shell
        run: python3 tools/apply_v1_5_player_patch.py

      - name: Correct Android callback visibility
        run: |
          sed -i 's/protected void onWindowFocusChanged/public void onWindowFocusChanged/' \
            asiaflix-clean-shell/app/src/main/java/org/asiaflix/clean/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        working-directory: asiaflix-clean-shell
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and package
        run: |
          APK='asiaflix-clean-shell/app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          mkdir -p out
          cp "$APK" out/Asia_Flix_Clean_Onn4K_TV_v1.5.apk
          sha256sum out/Asia_Flix_Clean_Onn4K_TV_v1.5.apk | tee out/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-Clean-Onn4K-TV-v1.5
          path: out/
          if-no-files-found: error
          retention-days: 30
