name: Build and Verify Asia Flix 2.0

on:
  push:
    branches:
      - asiaflix-clean-shell
    paths:
      - 'asiaflix-clean-shell/**'
      - '.github/workflows/build-asiaflix-clean.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'asiaflix-clean-shell/**'
      - '.github/workflows/build-asiaflix-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Install canonical v2 source tree
        run: python3 asiaflix-clean-shell/tools/install_canonical_v2.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify canonical feature matrix
        working-directory: asiaflix-clean-shell
        run: |
          node --check app/src/main/assets/asiaflix_bridge.js
          python3 tools/verify_canonical_release.py

      - name: Run JVM regression tests
        working-directory: asiaflix-clean-shell
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug and signed release APKs
        working-directory: asiaflix-clean-shell
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --no-daemon --stacktrace

      - name: Verify package, permissions, TV launcher, and signature
        run: |
          RELEASE='asiaflix-clean-shell/app/build/outputs/apk/release/app-release.apk'
          DEBUG='asiaflix-clean-shell/app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RELEASE" | tee release-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE" | tee release-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$RELEASE" | tee release-permissions.txt
          grep -q "package: name='org.asiaflix.clean' versionCode='20' versionName='2.0.0'" release-badging.txt
          grep -q '^leanback-launchable-activity:' release-badging.txt
          ! grep -q 'android.permission.POST_NOTIFICATIONS' release-permissions.txt
          mkdir -p out
          cp "$RELEASE" out/Asia_Flix_Final_Onn4K_Mobile_v2.0.apk
          cp "$DEBUG" out/Asia_Flix_Final_Onn4K_Mobile_v2.0-debug.apk
          sha256sum out/*.apk | tee out/SHA256.txt

      - name: Upload build for emulator jobs
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-v2-build
          path: |
            asiaflix-clean-shell/app/build/outputs/apk/debug/app-debug.apk
            asiaflix-clean-shell/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            out/
            release-signature.txt
            release-badging.txt
            release-permissions.txt
          if-no-files-found: error
          retention-days: 30

  mobile-functional-test:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install canonical v2 source tree
        run: python3 asiaflix-clean-shell/tools/install_canonical_v2.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run mobile emulator functional suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd asiaflix-clean-shell
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            adb logcat -d > ../mobile-logcat.txt
            adb exec-out screencap -p > ../mobile-final.png
            if grep -E 'FATAL EXCEPTION|ANR in org\.asiaflix\.clean' ../mobile-logcat.txt; then exit 1; fi

      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-v2-mobile-functional-evidence
          path: |
            asiaflix-clean-shell/app/build/reports/androidTests/connected/
            mobile-logcat.txt
            mobile-final.png
          if-no-files-found: warn
          retention-days: 30

  android-tv-smoke-test:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install canonical v2 source tree
        run: python3 asiaflix-clean-shell/tools/install_canonical_v2.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android TV D-pad and selector test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd asiaflix-clean-shell
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.class=org.asiaflix.clean.MainActivityInstrumentedTest#harnessRemovesXmAndMovesBlueTvFocus,org.asiaflix.clean.MainActivityInstrumentedTest#fullscreenDpadHoldAcceleratesForOnnRemote
            adb shell monkey -p org.asiaflix.clean -c android.intent.category.LEANBACK_LAUNCHER 1
            sleep 18
            adb shell input keyevent 22
            adb shell input keyevent 20
            adb shell input keyevent 23
            sleep 4
            adb logcat -d > ../tv-logcat.txt
            adb exec-out screencap -p > ../tv-final.png
            if grep -E 'FATAL EXCEPTION|ANR in org\.asiaflix\.clean' ../tv-logcat.txt; then exit 1; fi

      - name: Upload TV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-v2-TV-functional-evidence
          path: |
            asiaflix-clean-shell/app/build/reports/androidTests/connected/
            tv-logcat.txt
            tv-final.png
          if-no-files-found: warn
          retention-days: 30

  release-gate:
    needs: [build-and-unit-test, mobile-functional-test, android-tv-smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: Asia-Flix-v2-build
          path: verified

      - name: Assemble final verification report
        run: |
          mkdir -p final
          cp verified/out/Asia_Flix_Final_Onn4K_Mobile_v2.0.apk final/
          cp verified/out/SHA256.txt final/
          cp verified/release-signature.txt final/
          cp verified/release-badging.txt final/
          cp verified/release-permissions.txt final/
          cat > final/Asia_Flix_Final_v2.0_Verification.txt <<'REPORT'
          Asia Flix Final v2.0 release gate passed.

          Required feature checks:
          - Canonical source build; no legacy patch scripts.
          - First-party /api/advertisements blocked with an empty JSON response.
          - XM fallback DOM removal and empty advertisement-slot collapse.
          - Persistent blue Android TV selector.
          - Mobile fullscreen custom-view lifecycle and Back restoration.
          - Double-tap 10-second seeking.
          - Hold acceleration: 10 seconds, 30 seconds, 1 minute, then 2 minutes.
          - Player timeline/control region passes through untouched.
          - Onn-style D-pad seek, play/pause, navigation, and Leanback launcher.
          - Popup, external browser, Play Store intent, notification, and permission blocking.
          - JVM tests, mobile emulator functional tests, Android TV emulator tests, APK signature, package, and permission scans passed.

          Limitation:
          Emulator verification is not a substitute for final acceptance testing on a physical Onn 4K Streaming Box and Galaxy S23+.
          REPORT

      - name: Upload gated final release
        uses: actions/upload-artifact@v4
        with:
          name: Asia-Flix-Final-v2.0-Verified
          path: final/
          if-no-files-found: error
          retention-days: 30
